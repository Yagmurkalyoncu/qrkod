{% extends "base.html" %}

{% block content %}
<div id="admin-tab" class="tab-content active">
    <div class="admin-layout">
        
        <!-- SOL PANEL: YENİ EKLE -->
        <div class="left-panel">
            <h3>Yeni Otomasyon Ekle</h3>
            <form id="form-add-automation">
                <div class="input-group">
                    <label>OTOMASYON ADI</label>
                    <input type="text" id="new-name" placeholder="Örn: Boya_Kabini_1" required>
                </div>
                
                <div class="input-group">
                    <label>KABİN TİPİ</label>
                    <select id="new-type" required>
                        <option value="Sürgülü">Sürgülü Kapak</option>
                        <option value="Menteşeli">Menteşeli Kapak</option>
                        <option value="İçe Katlanır">İçe Katlanır Kapak</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>KABİN YÜKSEKLİĞİ (m)</label>
                    <input type="number" id="new-height" step="0.01" min="0.1" value="2.50" required>
                </div>

                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1; min-width:0;">
                        <label>X Koord.</label>
                        <input type="number" id="new-x" step="0.01" value="0.0" required style="width:100%; min-width:0; padding:14px 8px;">
                    </div>
                    <div class="input-group" style="flex:1; min-width:0;">
                        <label>Y Koord.</label>
                        <input type="number" id="new-y" step="0.01" value="0.0" required style="width:100%; min-width:0; padding:14px 8px;">
                    </div>
                    <div class="input-group" style="flex:1; min-width:0;">
                        <label>Z Koord.</label>
                        <input type="number" id="new-z" step="0.01" value="2.15" required style="width:100%; min-width:0; padding:14px 8px;">
                    </div>
                </div>

                <div class="input-group">
                    <label>MESAFE TOLERANSI</label>
                    <input type="number" id="new-dist-tol" step="0.01" min="0.01" value="0.05" required>
                </div>

                <div class="input-group">
                    <label>AÇI TOLERANSI</label>
                    <input type="number" id="new-aspect-tol" step="0.01" min="0.01" value="0.20" required>
                </div>

                <button type="submit" class="btn-primary">+ LİSTEYE EKLE</button>
            </form>
        </div>

        <!-- SAĞ PANEL: TABLO -->
        <div class="right-panel">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Kayıtlı otomasyonlar arasında ara...">
            </div>

            <div class="table-container">
                <div class="custom-table-scrollbar">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 70px; text-align: center;">SEÇ</th>
                                <th>OTOMASYON ADI</th>
                                <th>KABİN TİPİ</th>
                                <th style="width: 250px;">NAVİGASYON HEDEFİ (X, Y, Z)</th>
                                <th style="text-align: center;">TOLERANSLAR</th>
                                <th style="width: 80px; text-align: center;">SİL</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

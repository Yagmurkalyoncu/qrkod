<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotik Otomasyon Müdürlüğü - Komuta Merkezi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header2">
        <div class="header-content2">
            <!-- SOL BÖLÜM: BÖLÜM LOGOSU -->
            <div class="logo2">
                <!-- Eğer as.png yoksa kırık durmasın diye alternatif ikon -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>

            <!-- MERKEZ BÖLÜM: BAĞLI OLUNAN MÜDÜRLÜK ANTETİ -->
            <div class="title-container2">
                <div class="title-text">ROBOTİK OTOMASYON MÜDÜRLÜĞÜ</div>
                <div class="subtitle-text">Otomasyon Komuta Merkezi</div>
            </div>

            <!-- SAĞ BÖLÜM: DIŞ BAĞLANTI VE SCADA TELEMETRİ KISAYOLLARI -->
            <div class="icons">
                <a class="icon-container" href="#" title="Sistem Bildirimleri">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </a>
                <a class="icon-container" href="#" title="Kalite Kontrol Listesi">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </a>
                <a class="icon-container" href="#" title="Dahili İletişim Rehberi">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </a>
                <a class="icon-container" href="#" title="ROM Ana Veri Sayfası">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </a>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        {% block content %}{% endblock %}
    </main>

    <!-- BOTTOM NAV BAR -->
    <nav class="bottom-nav-bar">
        <!-- By making these actual anchor links, we rely on server routing instead of JS for page switching -->
        <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" style="text-decoration: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="2" y1="7" x2="7" y2="7"></line>
                <line x1="2" y1="17" x2="7" y2="17"></line>
                <line x1="17" y1="17" x2="22" y2="17"></line>
                <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
            <span>Ana Ekran (Tespit)</span>
        </a>
        <a href="/otomasyon" class="nav-item {% if request.path == '/otomasyon' %}active{% endif %}" style="text-decoration: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Otomasyon Ekranı</span>
        </a>
    </nav>

    <!-- NOTIFICATION POPUP -->
    <div id="popup-overlay" class="popup-overlay hidden">
        <div class="popup-box">
            <div class="popup-icon">⚠️</div>
            <h4>Bildirim</h4>
            <p id="popup-msg">Mesaj buraya gelecek</p>
            <button id="btn-popup-ok" class="btn-primary">Tamam</button>
        </div>
    </div>

    <!-- DELETE CONFIRM POPUP -->
    <div id="delete-overlay" class="popup-overlay hidden">
        <div class="popup-box">
            <div class="popup-icon">🗑️</div>
            <h4>Silme Onayı</h4>
            <p>Bu otomasyonu silmek istediğinize emin misiniz?</p>
            <div class="popup-actions">
                <button id="btn-delete-cancel" class="btn-secondary">İptal</button>
                <button id="btn-delete-confirm" class="btn-danger">Evet, Sil</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=5"></script>
</body>
</html>
